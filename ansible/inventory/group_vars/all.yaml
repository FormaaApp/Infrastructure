---
# bootstrap.yaml
ssh_port: 41571
packages:
  - git
  - age
sops_version: 3.13.3
supabase_cli_version: 2.117.0
users:
  - name: qishon
    groups:
      - sudo
    ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKdkphCtrS2dASXtibzKyJyUtb72mmZACKu8kLlByuOx qishon"

ufw_rules:
  - port: "{{ ssh_port }}"
    proto: tcp
    comment: "SSH"

  - port: "80"
    proto: tcp
    comment: "HTTP"

  - port: "443"
    proto: tcp
    comment: "HTTPS"

# workspace.yaml
service:
  user: supabase
  groups:
    - docker

supabase_version: "self-hosted/v0.8.1"
supabase_install_dir: "/home/{{ service.user }}/forma-supabase-backend"

runner_user: "{{ service.user }}"
runner_org: true
github_account: FormaaApp
runner_labels:
  - self-hosted
  - linux
  - docker
