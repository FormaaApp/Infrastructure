---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | string }}"
    proto: tcp
    comment: "SSH"

- name: Enable UFW
  community.general.ufw:
    state: enabled
