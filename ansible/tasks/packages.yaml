---
- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 604800 # 7 days
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present

- name: Install SOPS
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
    dest: /usr/local/bin/sops
    owner: root
    group: root
    mode: "0755"

- name: Download Supabase CLI .deb
  ansible.builtin.get_url:
    url: "https://github.com/supabase/cli/releases/download/v{{ supabase_cli_version }}/supabase_{{ supabase_cli_version }}_linux_amd64.deb"
    dest: "/tmp/supabase-cli.deb"
    mode: "0644"

- name: Install Supabase CLI
  ansible.builtin.apt:
    deb: "/tmp/supabase-cli.deb"
    state: present

- name: Install Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
