---
- name: Initial server setup
  hosts: servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Run preflight checks
      ansible.builtin.import_tasks: ../tasks/preflight.yaml

  handlers:
    - name: Import handlers
      ansible.builtin.import_tasks: ../handlers/main.yaml

  tasks:
    - name: Configure packages
      ansible.builtin.import_tasks: ../tasks/packages.yaml

    - name: Configure users
      ansible.builtin.import_tasks: ../tasks/users.yaml

    - name: Configure SSH
      ansible.builtin.import_tasks: ../tasks/ssh.yaml

    - name: Configure firewall
      ansible.builtin.import_tasks: ../tasks/firewall.yaml
